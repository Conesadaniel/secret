<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Memory Puzzle</title>

<style>
body{
font-family:Arial;
text-align:center;
background:#f4f4f4;
}

.grid{
display:grid;
grid-template-columns:repeat(4,90px);
gap:10px;
justify-content:center;
margin-top:30px;
}

.card{
width:90px;
height:90px;
background:#333;
color:white;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
cursor:pointer;
border-radius:8px;
}

.card.revealed{
background:#4CAF50;
}

#result{
font-size:40px;
margin-top:25px;
color:#2e7d32;
font-weight:bold;
}
</style>

</head>

<body>

<h1>Memory Puzzle</h1>
<p>Match all pairs to reveal the secret word</p>

<div class="grid" id="grid"></div>

<div id="result"></div>

<script>

const cards = ["T","T","E","E","M","M","O","O","I","I","N","N"];
cards.sort(()=>Math.random()-0.5);

const grid=document.getElementById("grid");

let first=null;
let second=null;
let lock=false;
let matches=0;

cards.forEach(letter=>{

const card=document.createElement("div");
card.className="card";
card.dataset.letter=letter;

card.onclick=()=>{

if(lock || card.classList.contains("revealed")) return;

card.textContent=letter;
card.classList.add("revealed");

if(!first){
first=card;
}
else{

second=card;
lock=true;

if(first.dataset.letter===second.dataset.letter){

matches++;

first=null;
second=null;
lock=false;

if(matches===6){
}

}
else{

setTimeout(()=>{

first.textContent="";
second.textContent="";

first.classList.remove("revealed");
second.classList.remove("revealed");

first=null;
second=null;
lock=false;

},700);

}

}

};

grid.appendChild(card);

});

</script>

</body>
</html>
